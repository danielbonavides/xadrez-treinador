name: Vendor Stockfish 19 ASM for Safari
on:
  push:
    branches:
      - feature/stockfish-audio-animation-v1
    paths:
      - '.github/workflows/vendor-stockfish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stockfish-audio-animation-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download pinned Stockfish package from npm registry
        run: |
          npm pack stockfish@19.0.1 --pack-destination /tmp
          mkdir -p vendor/stockfish
          tar -xzf /tmp/stockfish-19.0.1.tgz -C /tmp
          test -s /tmp/package/bin/stockfish-19-asm.js
          cp /tmp/package/bin/stockfish-19-asm.js vendor/stockfish/stockfish-19-asm.js
          sha256sum vendor/stockfish/stockfish-19-asm.js > vendor/stockfish/SHA256SUMS
      - name: Commit vendored engine to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/stockfish/stockfish-19-asm.js vendor/stockfish/SHA256SUMS
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: vendor Stockfish 19 ASM engine for Safari offline loading'
          git push origin HEAD:feature/stockfish-audio-animation-v1
