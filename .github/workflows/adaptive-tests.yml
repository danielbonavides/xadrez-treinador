name: Adaptive preview checks
on:
  push:
    branches: [feat/web-v1.4-adaptive]
  pull_request:
    paths: ['adaptive/**', 'teste-v1.4/**', 'tests/**', 'tools/**', '.github/workflows/adaptive-tests.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/build-adaptive.cjs
      - run: git diff --exit-code -- teste-v1.4 adaptive/revisions.js adaptive/legacy-revisions.js
      - run: node --test tests/adaptive.test.cjs tests/ui.test.cjs tests/stockfish-f5.test.cjs
      - run: python -m pip install python-chess==1.999
      - run: python tests/catalog_oracle.py
